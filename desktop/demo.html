<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New QC Sheet · 0.2.0</title>
  <!--
    Static UI mock of src/xlsx_clean/ui/index.html.
    Demo only — no create-datasheet behavior.
  -->
  <style>
    :root {
      --primary: #e54d5e;
      --accent-3: #a855f7;
      --success: #22c55e;
      --tl-red: #ff5f56;
      --tl-yellow: #ffbd2e;
      --tl-green: #27c93f;
      --bg: #0b0e14;
      --surface: #161b22;
      --surface-2: #1c2230;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.14);
      --grid-line: rgba(255, 255, 255, 0.06);
      --grid-size: 32px;
      --text: #e6e6ef;
      --text-muted: #8b8b9e;
      --text-dim: #5a5a6e;
      --grad-brand: linear-gradient(135deg, var(--primary), var(--accent-3));
      --radius: 14px;
      --radius-sm: 9px;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: 15px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: var(--grid-size) var(--grid-size);
    }

    .page {
      display: flex;
      min-height: 100vh;
      padding: 24px;
    }

    .panel {
      display: flex;
      flex-direction: column;
      width: min(100%, 36rem);
      margin: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 24px 60px -28px rgb(0 0 0 / 55%);
      overflow: hidden;
    }

    .chrome {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 40px;
      padding: 0 14px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }

    .traffic {
      display: flex;
      gap: 6px;
    }

    .traffic span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .tl-red { background: var(--tl-red); }
    .tl-yellow { background: var(--tl-yellow); }
    .tl-green { background: var(--tl-green); }

    .chrome-title {
      flex: 1;
      color: var(--text-muted);
      font-family: ui-monospace, monospace;
      font-size: 0.75rem;
      text-align: center;
    }

    .panel-body {
      display: flex;
      flex-direction: column;
      padding: 22px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 1.875rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 8px 0 22px;
      color: var(--text-muted);
    }

    .fields { display: grid; gap: 18px; }

    .field {
      position: relative;
      padding-top: 8px;
    }

    .field label {
      position: absolute;
      top: 0;
      left: 11px;
      padding: 0 4px;
      background: var(--surface);
      color: var(--primary);
      font-size: 0.75rem;
      z-index: 1;
    }

    .field select,
    .field input {
      width: 100%;
      appearance: none;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      padding: 0.85rem 2.25rem 0.85rem 0.85rem;
      font-size: 1rem;
      color: var(--text);
      outline: none;
    }

    .field .chevron {
      pointer-events: none;
      position: absolute;
      right: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .divider {
      height: 1px;
      margin: 22px 0;
      background: var(--border);
    }

    .btn-primary {
      width: 100%;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--grad-brand);
      color: #fff;
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.85rem 1rem;
      cursor: default;
    }

    .note {
      margin: 0 0 16px;
      color: var(--warning, #f59e0b);
      font-size: 0.85rem;
    }

    .terminal {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      overflow: hidden;
    }

    .terminal-bar {
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text-dim);
      font-family: ui-monospace, monospace;
      font-size: 0.7rem;
      text-transform: uppercase;
    }

    .status {
      min-height: 48px;
      padding: 12px;
      color: var(--success);
      font-family: ui-monospace, monospace;
      font-size: 0.8rem;
    }

    .status::before {
      content: "$ ";
      color: var(--primary);
      font-weight: 700;
    }

    .version {
      margin: 16px 0 0;
      color: var(--text-dim);
      font-family: ui-monospace, monospace;
      font-size: 0.75rem;
      text-align: right;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="panel">
      <div class="chrome">
        <span class="traffic" aria-hidden="true">
          <span class="tl-red"></span>
          <span class="tl-yellow"></span>
          <span class="tl-green"></span>
        </span>
        <span class="chrome-title">xlsx-clean — New QC Sheet</span>
      </div>
      <div class="panel-body">
        <p class="eyebrow">QC datasheet</p>
        <h1>New QC Sheet</h1>
        <p class="subtitle">
          Create a new QC datasheet from the latest matching workbook.
        </p>

        <div class="fields">
          <div class="field">
            <label>Select Set</label>
            <select aria-label="Select Set" tabindex="-1">
              <option selected>Kimia Razi</option>
              <option>inco</option>
            </select>
            <span class="chevron" aria-hidden="true">▾</span>
          </div>

          <div class="field">
            <label>Select Ink Color</label>
            <select aria-label="Select Ink Color" tabindex="-1">
              <option selected>KRCY1100T Blue</option>
              <option>KRBK1300T Black</option>
              <option>KRBK1314T Black</option>
              <option>KRBR1200T Brown</option>
              <option>KRBG1600T Beige</option>
              <option>KRHN1700T Honey</option>
              <option>KRPK1500T Pink</option>
            </select>
            <span class="chevron" aria-hidden="true">▾</span>
          </div>

          <div class="field">
            <label>Serial:</label>
            <input
              type="text"
              placeholder="e.g. 1234/A"
              value=""
              aria-label="Serial"
              tabindex="-1"
              readonly
            />
          </div>

          <div class="field">
            <label>Backend</label>
            <select aria-label="Backend" tabindex="-1">
              <option selected>ooxml</option>
              <option>com</option>
            </select>
            <span class="chevron" aria-hidden="true">▾</span>
          </div>
        </div>

        <p class="note">
          COM backend requires Windows with Microsoft Excel; use ooxml here.
        </p>

        <div class="divider"></div>
        <button type="button" class="btn-primary" tabindex="-1">
          Create datasheet
        </button>

        <div class="terminal" style="margin-top: 16px;">
          <div class="terminal-bar">status</div>
          <div class="status">Ready.</div>
        </div>

        <p class="version">v0.2.0</p>
      </div>
    </section>
  </main>
</body>
</html>
