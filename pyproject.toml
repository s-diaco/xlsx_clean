[project]
name = "xlsx-clean"
version = "1.0.0"
description = "Create a new QC datasheet from the latest matching workbook"
authors = [
    { name = "Diaco Soltanpour", email = "dyaco8464@yahoo.com" }
]
dependencies = [
    "beaupy>=3.12.0",
    "pywebview>=5.0",
    "pywin32>=312; sys_platform == 'win32'",
]
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
xlsx-clean = "xlsx_clean.clean_cells:main"
xlsx-clean-gui = "xlsx_clean.gui_app:main"

[project.optional-dependencies]
desktop = [
    "pyinstaller>=6.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/xlsx_clean"]

[tool.hatch.build.targets.wheel.force-include]
"src/xlsx_clean/file_data.csv" = "xlsx_clean/file_data.csv"
"src/xlsx_clean/strings.txt" = "xlsx_clean/strings.txt"
"src/xlsx_clean/new_xslx.bat" = "xlsx_clean/new_xslx.bat"

[dependency-groups]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
default-groups = ["test"]

# Version bumps: `uvx bump-my-version bump patch|minor|major`
# current_version falls back to [project].version above.
[tool.bumpversion]
commit = false
tag = false
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
message = "Bump version: {current_version} → {new_version}"
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
