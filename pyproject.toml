[project]
name = "xlsx-clean"
version = "0.1.0"
description = "Create a new QC datasheet from the latest matching workbook"
authors = [
    { name = "Diaco Soltanpour", email = "dyaco8464@yahoo.com" }
]
dependencies = [
    "beaupy>=3.12.0",
    "nicegui>=3.14.0",
    "pandas>=3.0.3",
    "pywebview>=6.2.1",
    "pywin32>=312; sys_platform == 'win32'",
]
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
xlsx-clean = "xlsx_clean.clean_cells:main"
xlsx-clean-web = "xlsx_clean.web_app:main"

[project.optional-dependencies]
desktop = [
    "pyinstaller>=6.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/xlsx_clean"]

[tool.hatch.build.targets.wheel.force-include]
"src/xlsx_clean/file_data.csv" = "xlsx_clean/file_data.csv"
"src/xlsx_clean/strings.txt" = "xlsx_clean/strings.txt"
"src/xlsx_clean/new_xslx.bat" = "xlsx_clean/new_xslx.bat"

[tool.uv]
package = true
